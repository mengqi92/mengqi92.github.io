# File: .github/workflows/setup-node/action.yml
name: setup-node
description: "Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js ⚙️
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cache dependencies ⚡
      id: cache_dependencies
      uses: actions/cache@v3
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies 🔧
      shell: bash
      if: steps.cache_dependencies.outputs.cache-hit != 'true'
      run: npm install

    - name: Install system dependencies for Playwright
      shell: bash
      run: |
        # Update package lists and upgrade
        sudo apt-get update
        sudo apt-get upgrade -y
        
        # Add universe and multiverse repositories for additional packages
        sudo add-apt-repository universe -y
        sudo add-apt-repository multiverse -y
        sudo apt-get update
        
        # Install xvfb and other system dependencies required by Playwright
        # Using the correct package names based on the error message
        # Try using apt-cache policy to check available versions of problematic packages
        sudo apt-cache policy libasound2 libffi7 libx264-163 || true
        
        # Install the required dependencies for Playwright
        sudo apt-get install -y wget xvfb \
          liboss4-salsa-asound2 libffi8ubuntu1 libffi-dev libx264-dev \
          libgbm-dev libnspr4 libnss3 libxss1 \
          libxcursor1 libxi6 libxtst6 fonts-liberation \
          libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
          libdbus-1-3 libatspi2.0-0 libxrandr2 libxcomposite1 \
          libpangocairo-1.0-0 libgtk-3-0 libasound2-dev \
          libavcodec-dev libavformat-dev libswscale-dev \
          # Try the following as alternatives if the above fails
          || sudo apt-get install -y wget xvfb \
          libsndio7.0 libffi8ubuntu1 libx264-155 \
          libgbm-dev libnspr4 libnss3 libxss1 \
          libxcursor1 libxi6 libxtst6 fonts-liberation \
          libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
          libdbus-1-3 libatspi2.0-0 libxrandr2 libxcomposite1 \
          libpangocairo-1.0-0 libgtk-3-0 libasound2-dev \
          libavcodec-dev libavformat-dev libswscale-dev

    - name: Install Playwright browsers
      shell: bash
      run: |
        # Install Playwright browsers with the --force flag to skip optional dependencies
        # that might fail and continue with the installation
        # Skip the system dependencies installation (--skip-deps) since we handled them manually
        npx playwright install chromium firefox webkit --force

# File: .github/workflows/setup-node/action.yml
name: setup-node
description: "Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js ⚙️
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cache dependencies ⚡
      id: cache_dependencies
      uses: actions/cache@v3
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies 🔧
      shell: bash
      if: steps.cache_dependencies.outputs.cache-hit != 'true'
      run: npm install

    - name: Install system dependencies for Playwright
      shell: bash
      run: |
        # Update package lists
        sudo apt-get update

        # Install the minimal set of dependencies required for Playwright
        # Use specific packages that are known to be available
        sudo apt-get install -y wget xvfb \
          liboss4-salsa-asound2 libffi-dev libx264-dev \
          libgbm-dev libnspr4 libnss3 libxss1 \
          libxcursor1 libxi6 libxtst6 fonts-liberation \
          libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
          libdbus-1-3 libatspi2.0-0 libxrandr2 libxcomposite1 \
          libpangocairo-1.0-0 libgtk-3-0

    - name: Install Playwright browsers
      shell: bash
      run: |
        # Install Playwright browsers without attempting to install system dependencies
        # Use the --skip-deps flag to prevent it from trying to install packages that might not be available
        npx playwright install --skip-deps chromium firefox webkit
